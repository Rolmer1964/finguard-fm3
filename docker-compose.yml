services:
  app:
    build: ./app
    container_name: finguard_app
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./assets/adr.html:/app/assets/adr.html:ro
      - ./assets/hackathon:/app/assets/hackathon:ro
      - ./assets/docs:/app/assets/docs:ro  # política interna — somente leitura no container
      - ./assets/index:/app/assets/index   # índice FAISS — persiste entre restarts
      - ./output:/app/output               # relatórios gerados — persiste entre restarts
      - ./data:/app/data:ro
    restart: unless-stopped
